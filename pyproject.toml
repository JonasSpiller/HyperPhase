[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperphase"
version = "1.0.0"
description = "Phase curves of hyper-illuminated rocky exoplanets: extended-source irradiance, thermal and reflected light curves, bias analysis and nested-sampling retrievals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Spiller" }]
requires-python = ">=3.11"
# fSPIDERMAN (the thermal phase curves) is not on PyPI: install it from https://github.com/JonasSpiller/fSPIDERMAN (see environment.yml).
dependencies = ["numpy>=2", "scipy", "matplotlib", "pandas", "astropy", "joblib", "pillow", "batman-package", "dynesty>=3"]

[project.optional-dependencies]
noise = ["pandexo.engine", "pandeia.engine", "synphot", "stsynphot"]   # PandExo noise levels beyond the shipped cache
limb-darkening = ["exotic-ld", "setuptools<81"]   # ExoTiC-LD 3.2.0 imports pkg_resources, which setuptools 81 removed
validation = ["colorama"]   # validation/instellca_comparison.ipynb: InstellCa imports colorama
newera = ["h5py"]   # inputs/stellar_model/NewEra/build_newera.ipynb, which builds the NewEra cube
test = ["pytest"]

[project.urls]
Repository = "https://github.com/JonasSpiller/HyperPhase"

# The package hyperphase/ reads its data (filters, planet and band tables, stellar spectra, PandExo cache) from inputs/ of the repository
# (hyperphase.paths; HYPERPHASE_DATA points elsewhere), so install with `pip install -e .` (editable) rather than `pip install .`.
[tool.setuptools.packages.find]
include = ["hyperphase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: a test that takes more than a few seconds (deselect with -m \"not slow\")"]
